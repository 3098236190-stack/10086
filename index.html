<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c1532" />
    <meta name="description" content="流光互动音乐空间——在手势中唤醒画面与声响的实时生成体验。" />
    <title>流光互动音乐空间</title>
    <style>
      :root {
        --bg-a: #0c1532;
        --bg-b: #146c88;
        --bg-c: #f4b35e;
        --bg-d: #f44d76;
        --accent: #8bf0c8;
        --ink: #f8fbff;
        --muted: rgba(248, 251, 255, 0.72);
        --panel: rgba(9, 14, 28, 0.56);
        --panel-strong: rgba(9, 14, 28, 0.72);
        --line: rgba(255, 255, 255, 0.16);
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
        --flow-duration: 60s;
        --color-power: 0.76;
        --shade-opacity: 1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 84px;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #0b1430, #060a18 70%);
        overflow-x: hidden;
      }

      /* Flowing colour field: a single large gradient layer that only ever
         animates `transform`, so it is rasterised once and composited on the GPU —
         no per-frame viewport repaints (the source of the previous jank). */
      .backdrop {
        position: fixed;
        inset: -55%;
        z-index: -2;
        background: conic-gradient(
          from 130deg,
          var(--bg-a),
          var(--bg-b),
          var(--bg-c),
          var(--bg-d),
          var(--bg-a)
        );
        filter: blur(54px) saturate(calc(80% + var(--color-power, 0.76) * 110%));
        opacity: 0.96;
        transform: translateZ(0);
        animation: drift var(--flow-duration, 60s) linear infinite;
        will-change: transform;
      }

      /* Soft highlight that trails the pointer — moved only via translate3d in JS,
         so it is also fully compositor-driven and stays smooth. */
      .aura {
        position: fixed;
        top: 0;
        left: 0;
        width: 72vmax;
        height: 72vmax;
        margin: -36vmax 0 0 -36vmax;
        z-index: -1;
        border-radius: 50%;
        background: radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.26),
          rgba(255, 255, 255, 0.06) 40%,
          transparent 68%
        );
        mix-blend-mode: soft-light;
        opacity: calc(0.4 + var(--color-power, 0.76) * 0.6);
        pointer-events: none;
        transform: translate3d(50vw, 50vh, 0);
        will-change: transform;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        background:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.18));
      }

      body::after {
        background: linear-gradient(to bottom, rgba(2, 7, 21, 0.08), rgba(2, 7, 21, 0.24) 58%, rgba(2, 7, 21, 0.66));
        mix-blend-mode: soft-light;
        opacity: var(--shade-opacity);
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
        cursor: pointer;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .prompt-field input:focus-visible {
        outline: none;
      }

      #particleCanvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
      }

      .site-nav {
        position: fixed;
        top: 12px;
        left: 50%;
        z-index: 4;
        width: min(1180px, calc(100% - 32px));
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(6, 9, 18, 0.32);
        backdrop-filter: blur(22px) saturate(140%);
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.18);
        transform: translateX(-50%);
      }

      .site-nav a {
        color: rgba(255, 255, 255, 0.84);
        text-decoration: none;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.98rem;
        font-weight: 900;
      }

      .brand-mark {
        width: 23px;
        height: 23px;
        border: 1px solid rgba(255, 255, 255, 0.46);
        border-radius: 7px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.9), transparent 44%),
          linear-gradient(135deg, var(--accent), rgba(255, 255, 255, 0.1));
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
      }

      .site-nav nav {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(18px);
      }

      .site-nav nav a {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        padding: 0 12px;
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.82rem;
        font-weight: 800;
        transition:
          background-color 180ms ease,
          color 180ms ease;
      }

      .site-nav nav a:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }

      .stage {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 94px 0 36px;
        display: grid;
        grid-template-rows: minmax(280px, 40vh) auto auto;
        gap: 20px;
      }

      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        min-height: 0;
      }

      .hero-copy {
        max-width: 760px;
        padding-bottom: 8px;
        animation: riseIn 880ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .status-strip {
        animation: riseIn 880ms cubic-bezier(0.2, 0.7, 0.2, 1) 140ms both;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        max-width: 9ch;
        font-size: clamp(3.7rem, 12vw, 8.4rem);
        line-height: 0.9;
        letter-spacing: -0.01em;
        text-wrap: balance;
        background: linear-gradient(178deg, #ffffff 32%, rgba(255, 255, 255, 0.78));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 16px 44px rgba(0, 0, 0, 0.42));
      }

      .lede {
        margin-top: 20px;
        max-width: 32rem;
        color: rgba(255, 255, 255, 0.86);
        font-size: clamp(1rem, 2vw, 1.28rem);
        line-height: 1.6;
      }

      .status-strip {
        align-self: flex-end;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        min-width: 236px;
        padding-bottom: 16px;
      }

      .status-strip span {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        padding: 8px 11px;
        background: rgba(0, 0, 0, 0.22);
        color: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(16px);
        font-size: 0.78rem;
        white-space: nowrap;
      }

      .control-shell {
        display: grid;
        grid-template-columns: minmax(210px, 0.78fr) minmax(320px, 1.35fr) minmax(210px, 0.82fr);
        gap: 14px;
        align-items: stretch;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px) saturate(130%);
      }

      .panel-head {
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .panel-head h2 {
        font-size: 1rem;
        font-weight: 850;
      }

      .panel-head span {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .swatch-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(34px, 1fr));
        gap: 8px;
        margin-bottom: 20px;
      }

      .swatch {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 50%;
        background: linear-gradient(135deg, var(--s1), var(--s2), var(--s3), var(--s4));
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16);
        transition: transform 160ms ease;
      }

      .swatch:hover {
        transform: scale(1.07);
      }

      .swatch.active::after {
        content: "";
        position: absolute;
        inset: -5px;
        border: 2px solid rgba(255, 255, 255, 0.78);
        border-radius: inherit;
      }

      .field,
      .prompt-field,
      .toggle-field {
        display: grid;
        gap: 8px;
      }

      .field + .field {
        margin-top: 17px;
      }

      .field span,
      .prompt-field span {
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.82rem;
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .prompt-field input {
        width: 100%;
        min-height: 46px;
        border: 1px solid rgba(255, 255, 255, 0.17);
        border-radius: 8px;
        outline: none;
        padding: 0 13px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.22);
        transition:
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .prompt-field input:focus {
        border-color: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
      }

      .toggle-field {
        grid-template-columns: 40px 1fr;
        align-items: center;
        width: max-content;
        margin-top: 12px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.82rem;
        font-weight: 800;
        cursor: pointer;
      }

      .toggle-field input {
        appearance: none;
        position: relative;
        width: 40px;
        height: 22px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
        outline: none;
        cursor: pointer;
        transition:
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .toggle-field input::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        transition: transform 180ms ease;
      }

      .toggle-field input:checked {
        border-color: rgba(255, 255, 255, 0.56);
        background: var(--accent);
      }

      .toggle-field input:checked::after {
        transform: translateX(18px);
        background: #071b16;
      }

      .button-row {
        display: grid;
        grid-template-columns: minmax(118px, 0.65fr) minmax(152px, 1fr);
        gap: 10px;
        margin: 14px 0;
      }

      .primary-action,
      .secondary-action,
      .mode-button,
      .icon-button {
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        min-height: 42px;
        background: rgba(255, 255, 255, 0.1);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease;
      }

      .primary-action:hover,
      .secondary-action:hover,
      .mode-button:hover,
      .icon-button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.36);
        background: rgba(255, 255, 255, 0.16);
      }

      .primary-action:active,
      .secondary-action:active,
      .mode-button:active,
      .icon-button:active {
        transform: translateY(0);
      }

      .primary-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #082116;
        background: linear-gradient(135deg, #ffffff, var(--accent));
        border-color: rgba(255, 255, 255, 0.62);
        font-weight: 850;
      }

      .secondary-action {
        font-weight: 800;
        color: #ffffff;
      }

      .icon-button {
        width: 38px;
        min-height: 38px;
        display: inline-grid;
        place-items: center;
        padding: 0;
        font-size: 1rem;
        line-height: 1;
      }

      .music-visualizer {
        height: 88px;
        display: grid;
        grid-template-columns: repeat(24, 1fr);
        align-items: end;
        gap: 4px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .bar {
        min-height: 8px;
        height: var(--h, 32%);
        border-radius: 999px 999px 2px 2px;
        background: linear-gradient(to top, rgba(255, 255, 255, 0.42), var(--accent));
        opacity: 0.68;
        transform-origin: bottom;
        transition: height 320ms ease;
      }

      body.playing .bar {
        animation: pulseBar var(--d, 820ms) ease-in-out infinite alternate;
        animation-delay: var(--delay, 0ms);
      }

      .sequence-grid {
        display: grid;
        grid-template-columns: repeat(16, 1fr);
        gap: 4px;
        margin-top: 10px;
      }

      .sequence-dot {
        height: 12px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
        transition:
          background-color 160ms ease,
          transform 160ms ease,
          opacity 160ms ease;
      }

      .sequence-dot.on {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), var(--accent));
        opacity: 0.9;
      }

      .sequence-dot.active {
        transform: translateY(-3px);
        background: #ffffff;
      }

      .music-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 14px;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        padding: 4px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.18);
        margin-bottom: 20px;
      }

      .mode-button {
        min-height: 34px;
        padding: 0 8px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.84rem;
      }

      .mode-button.active {
        color: #071b16;
        background: linear-gradient(135deg, #ffffff, var(--accent));
        border-color: rgba(255, 255, 255, 0.52);
        font-weight: 850;
      }

      .scene-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .scene-card {
        min-height: 108px;
        display: grid;
        align-content: end;
        gap: 6px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        padding: 14px;
        text-align: left;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.02)),
          rgba(0, 0, 0, 0.2);
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(20px);
        transition:
          transform 200ms ease,
          border-color 200ms ease,
          background 200ms ease;
      }

      .scene-card span {
        font-size: 1rem;
        font-weight: 900;
      }

      .scene-card small {
        color: rgba(255, 255, 255, 0.68);
        font-size: 0.75rem;
        font-weight: 800;
      }

      .scene-card:hover,
      .scene-card.active {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.36);
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.06)),
          rgba(0, 0, 0, 0.22);
      }

      .panel-label {
        margin: 18px 0 8px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .genre-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 16px;
      }

      .genre-chip {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.2);
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.8rem;
        font-weight: 800;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background-color 160ms ease,
          color 160ms ease;
      }

      .genre-chip:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.36);
      }

      .genre-chip.active {
        color: #071b16;
        background: linear-gradient(135deg, #ffffff, var(--accent));
        border-color: rgba(255, 255, 255, 0.52);
      }

      .genre-chip small {
        font-size: 0.7rem;
        font-weight: 700;
        opacity: 0.66;
      }

      .full-action {
        width: 100%;
        margin-top: 16px;
        min-height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        font-weight: 800;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease;
      }

      .full-action:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.36);
        background: rgba(255, 255, 255, 0.16);
      }

      .full-action:active {
        transform: translateY(0);
      }

      @keyframes drift {
        from {
          transform: rotate(0deg) scale(1.06);
        }
        to {
          transform: rotate(360deg) scale(1.06);
        }
      }

      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes pulseBar {
        from {
          height: calc(var(--h) * 0.52);
          opacity: 0.48;
        }
        to {
          height: min(100%, calc(var(--h) * 1.35));
          opacity: 0.92;
        }
      }

      @media (max-width: 900px) {
        .site-nav {
          width: min(100% - 22px, 680px);
        }

        .stage {
          width: min(100% - 22px, 680px);
          grid-template-rows: auto auto auto;
          padding-top: 88px;
        }

        .hero {
          min-height: 52vh;
          align-items: flex-end;
          flex-direction: column;
          justify-content: flex-end;
        }

        .hero-copy,
        .status-strip {
          width: 100%;
        }

        .status-strip {
          justify-content: flex-start;
          padding-bottom: 0;
        }

        .control-shell {
          grid-template-columns: 1fr;
        }

        .scene-strip {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 520px) {
        .site-nav {
          min-height: 48px;
          width: calc(100% - 18px);
        }

        .site-nav nav a {
          min-height: 32px;
          padding: 0 9px;
        }

        .stage {
          width: calc(100% - 18px);
          padding-top: 82px;
          padding-bottom: 18px;
        }

        h1 {
          font-size: clamp(3.15rem, 20vw, 5.4rem);
        }

        .panel {
          padding: 14px;
        }

        .button-row,
        .music-grid {
          grid-template-columns: 1fr;
        }

        .swatch-grid {
          grid-template-columns: repeat(5, minmax(28px, 1fr));
        }

        .scene-strip {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }

        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="aura" id="aura" aria-hidden="true"></div>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <header class="site-nav" aria-label="站点导航">
      <a class="brand" href="#top" aria-label="流光互动音乐空间">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>流光</span>
      </a>
      <nav>
        <a href="#studio">Studio</a>
        <a href="#scenes">Scenes</a>
        <a href="./about.html">关于</a>
      </nav>
    </header>

    <main class="stage">
      <section class="hero" id="top" aria-label="流光互动音乐空间">
        <div class="hero-copy">
          <p class="eyebrow">LIVE GENERATIVE EXPERIENCE</p>
          <h1>流光互动音乐空间</h1>
          <p class="lede">今晚，让画面和声响在你的手势里醒来。</p>
        </div>

        <div class="status-strip" aria-live="polite">
          <span id="moodChip">Aurora / C Major</span>
          <span id="tempoChip">92 BPM</span>
          <span id="energyChip">Energy 62%</span>
        </div>
      </section>

      <section class="control-shell" id="studio" aria-label="互动控制台">
        <div class="panel palette-panel">
          <div class="panel-head">
            <h2>背景</h2>
            <span id="paletteName">Aurora</span>
          </div>

      const scaleSteps = {

      const keyMidi = { C: 60, D: 62, E: 64, F: 65, G: 67, A: 69, B: 71 };

      const els = {
        canvas: document.querySelector("#particleCanvas"),
        aura: document.querySelector("#aura"),
        paletteButtons: document.querySelector("#paletteButtons"),
        paletteName: document.querySelector("#paletteName"),

      const ctx = els.canvas.getContext("2d");
      const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false, down: false };
      const state = {
        paletteIndex: 0,
        mode: "orbit",

        particles: [],
        figures: [],

        bars: [],

      let audio = null;
      let schedulerId = null;
      let nextStepTime = 0;
      let stepIndex = 0;
      let absoluteStep = 0;
      let lastFrameTime = performance.now();
      let beatPulse = 0;
      const aura = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function hashString(text) {
        let h = 2166136261;
        for (let i = 0; i < text.length; i += 1) {
          h ^= text.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function mulberry32(seed) {
        let t = seed >>> 0;
        return () => {
          t += 0x6d2b79f5;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      function hexToRgba(hex, alpha) {
        const value = hex.replace("#", "");
        const rgb = value.match(/.{1,2}/g).map((part) => parseInt(part, 16));
        return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
      }

      function midiToFreq(midi) {
        return 440 * 2 ** ((midi - 69) / 12);
      }

      function choose(array, rng) {
        return array[Math.floor(rng() * array.length)];
      }

      function setupPalettes() {
        palettes.forEach((palette, index) => {
          const button = document.createElement("button");
          button.className = "swatch";
          button.type = "button";
          button.setAttribute("aria-label", palette.name);
          button.setAttribute("aria-pressed", index === state.paletteIndex ? "true" : "false");
          button.style.setProperty("--s1", palette.colors[0]);
          button.style.setProperty("--s2", palette.colors[1]);
          button.style.setProperty("--s3", palette.colors[2]);
          button.style.setProperty("--s4", palette.colors[3]);
          button.addEventListener("click", () => setPalette(index));
          els.paletteButtons.append(button);
        });
      }

      function setPalette(index) {
        state.paletteIndex = index;
        const palette = palettes[index];
        palette.colors.forEach((color, colorIndex) => {
          document.documentElement.style.setProperty(`--bg-${String.fromCharCode(97 + colorIndex)}`, color);
        });
        document.documentElement.style.setProperty("--accent", palette.accent);
        els.paletteName.textContent = palette.name;

        document.querySelectorAll(".swatch").forEach((button, buttonIndex) => {
          const isActive = buttonIndex === index;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });

        tintParticles();
        composeMusic(false);
      }

      function setParticleMode(mode) {
        state.mode = mode;
        document.querySelectorAll(".mode-button").forEach((button) => {
          const isActive = button.dataset.mode === mode;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");

      }

      function setupGenres() {
        Object.entries(genres).forEach(([id, g]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "genre-chip" + (id === state.genre ? " active" : "");
          button.dataset.genre = id;
          button.setAttribute("aria-pressed", id === state.genre ? "true" : "false");
          button.innerHTML = `${g.zh} <small>${g.en}</small>`;
          button.addEventListener("click", () => {
            setGenre(id);
            burst(14);
          });
          els.genreRow.append(button);
        });
      }

      function setGenre(id, options = {}) {
        const { recompose = true, setSliders = true } = options;
        if (!genres[id]) return;
        state.genre = id;
        const g = genres[id];
        if (setSliders) {
          els.tempo.value = g.tempo;
          els.energy.value = g.energy;
        }

          const isActive = button.dataset.genre === id;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");

        if (recompose) composeMusic(true);
        else if (state.composition) updateStatus();

      function updateBackgroundControls() {
        const speed = Number(els.flowSpeed.value);
        const power = Number(els.colorPower.value);
        const root = document.documentElement.style;
        // Higher speed -> shorter rotation period for the composited colour field.
        root.setProperty("--flow-duration", `${clamp(124 - speed * 0.62, 26, 112).toFixed(1)}s`);
        root.setProperty("--color-power", (power / 100).toFixed(3));
        root.setProperty("--shade-opacity", (0.76 + power / 420).toFixed(3));
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        els.canvas.width = Math.floor(window.innerWidth * dpr);
        els.canvas.height = Math.floor(window.innerHeight * dpr);
        els.canvas.style.width = `${window.innerWidth}px`;
        els.canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        syncParticleCount();
      }

      function createParticle(rng = Math.random, fromPointer = false) {
        const palette = palettes[state.paletteIndex];
        const color = choose(palette.colors.concat(palette.accent), rng);
        const angle = rng() * Math.PI * 2;
        const speed = 0.18 + rng() * 0.72;
        return {
          x: fromPointer ? pointer.x + (rng() - 0.5) * 36 : rng() * window.innerWidth,
          y: fromPointer ? pointer.y + (rng() - 0.5) * 36 : rng() * window.innerHeight,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 1.3 + rng() * 3.8,
          color,
          glow: palette.accent,
          phase: rng() * Math.PI * 2,
          life: fromPointer ? 90 + rng() * 90 : Infinity,
        };
      }

      // Ambient particles use life === Infinity and are governed by the density
      // slider; burst particles are finite-life and live alongside them without
      // being culled by the density target.
      function syncParticleCount() {
        const target = Math.round(Number(els.particleDensity.value));
        let ambient = 0;
        for (let i = 0; i < state.particles.length; i += 1) {
          if (state.particles[i].life === Infinity) ambient += 1;
        }

        const rng = mulberry32(state.seed + target + state.paletteIndex * 97);
        while (ambient < target) {
          state.particles.push(createParticle(rng));
          ambient += 1;
        }
        while (ambient > target) {
          for (let i = state.particles.length - 1; i >= 0; i -= 1) {
            if (state.particles[i].life === Infinity) {
              state.particles.splice(i, 1);
              ambient -= 1;
              break;
            }
          }
        }
      }

      function tintParticles() {
        const rng = mulberry32(state.seed + state.paletteIndex * 997);
        const palette = palettes[state.paletteIndex];
        state.particles.forEach((particle) => {
          particle.color = choose(palette.colors.concat(palette.accent), rng);
          particle.glow = palette.accent;
        });
      }

      function burst(count = 34) {
        const rng = mulberry32(hashString(`${state.seed}-${performance.now()}`));
        for (let i = 0; i < count; i += 1) {
          const particle = createParticle(rng, true);
          const angle = (i / count) * Math.PI * 2 + rng() * 0.2;
          const speed = 2 + rng() * 5.5;
          particle.vx = Math.cos(angle) * speed;
          particle.vy = Math.sin(angle) * speed;
          particle.r += 1.4;
          state.particles.push(particle);
        }
      }

      // —— 积木小人 / cute block people ——
      function spawnFigure(x, y, type = "buddy") {
        if (state.figures.length >= 16) state.figures.shift();
        const r = Math.random;
        const pool = type === "forest" ? forestPalette : figurePalette;
        state.figures.push({
          type,
          x: x ?? r() * window.innerWidth,
          baseY: y ?? window.innerHeight * (0.6 + r() * 0.28),
          vx: (r() - 0.5) * 0.5,
          scale: 1.7 + r() * 1.5,
          phase: r() * Math.PI * 2,
          bobSpeed: 0.03 + r() * 0.02,
          bounce: 0.7 + r() * 0.5,
          body: pool[Math.floor(r() * pool.length)],
          blink: 0,
          blinkAt: 60 + r() * 240,
          appear: 0,
        });
      }

      function blockRect(x, y, w, h, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, radius);
        else ctx.rect(x, y, w, h);
        ctx.fill();
      }

      function drawFigure(f, hop) {
        const s = f.scale;
        const bob = Math.sin(f.phase) * 1.6;
        const y = f.baseY + bob - hop * 9;
        const a = f.appear;
        const head = "#fdf3e3";
        const dark = "rgba(44, 50, 74, 0.92)";

        ctx.save();
        ctx.translate(f.x, y);
        ctx.scale(a, a * (1 + hop * 0.06));

        ctx.globalAlpha = 0.16 * a;
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.ellipse(0, 19 * s, (11 + hop * 3) * s, 3.4 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = a;

        blockRect(-5.5 * s, 9 * s, 4 * s, 7 * s, 2 * s, dark);
        blockRect(1.5 * s, 9 * s, 4 * s, 7 * s, 2 * s, dark);
        const armY = -2 * s - hop * 3 * s;
        blockRect(-12 * s, armY, 4 * s, 9 * s, 2 * s, f.body);
        blockRect(8 * s, armY, 4 * s, 9 * s, 2 * s, f.body);
        blockRect(-8.5 * s, -7 * s, 17 * s, 16 * s, 5 * s, f.body);
        blockRect(-8 * s, -23 * s, 16 * s, 16 * s, 5 * s, head);

        // Eyes follow the pointer a little.
        const px = clamp((pointer.x - f.x) / 140, -1, 1) * 1.4 * s;
        const py = clamp((pointer.y - f.baseY) / 160, -1, 1) * 1.2 * s;
        ctx.fillStyle = "#3a2f2a";
        if (f.blink > 0) {
          ctx.fillRect(-4.6 * s + px, -16 * s + py, 2.8 * s, 0.9 * s);
          ctx.fillRect(1.8 * s + px, -16 * s + py, 2.8 * s, 0.9 * s);
        } else {
          ctx.beginPath();
          ctx.arc(-3.2 * s + px, -15.5 * s + py, 1.5 * s, 0, Math.PI * 2);
          ctx.arc(3.2 * s + px, -15.5 * s + py, 1.5 * s, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "rgba(255, 120, 150, 0.45)";
        ctx.beginPath();
        ctx.arc(-5.2 * s, -12.5 * s, 1.7 * s, 0, Math.PI * 2);
        ctx.arc(5.2 * s, -12.5 * s, 1.7 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#3a2f2a";
        ctx.lineWidth = 1.2 * s;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, -13.5 * s, 2.3 * s, 0.18 * Math.PI, 0.82 * Math.PI);
        ctx.stroke();

        ctx.restore();
      }

      // 小树林赛博小人 · style 1: moss-and-circuit symbiote — matte green body
      // with moss & a mushroom, a CRT head, twig antenna and firefly-green
      // pixel eyes that breathe.
      function drawForestSprite(f, hop) {
        const s = f.scale;
        const bob = Math.sin(f.phase) * 1.6;
        const y = f.baseY + bob - hop * 9;
        const a = f.appear;
        const body = f.body;
        const dark = "rgba(28, 38, 26, 0.92)";

        ctx.save();
        ctx.translate(f.x, y);
        ctx.scale(a, a * (1 + hop * 0.06));

        ctx.globalAlpha = 0.16 * a;
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.ellipse(0, 19 * s, (11 + hop * 3) * s, 3.4 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = a;

        // legs / arms / body
        blockRect(-5.5 * s, 9 * s, 4 * s, 7 * s, 2 * s, dark);
        blockRect(1.5 * s, 9 * s, 4 * s, 7 * s, 2 * s, dark);
        const armY = -2 * s - hop * 3 * s;
        blockRect(-12 * s, armY, 4 * s, 9 * s, 2 * s, body);
        blockRect(8 * s, armY, 4 * s, 9 * s, 2 * s, body);
        blockRect(-8.5 * s, -7 * s, 17 * s, 16 * s, 5 * s, body);

        // moss specks
        ctx.fillStyle = "rgba(160, 205, 120, 0.75)";
        ctx.beginPath();
        ctx.arc(-5 * s, 3 * s, 1.2 * s, 0, Math.PI * 2);
        ctx.arc(3 * s, 6 * s, 1 * s, 0, Math.PI * 2);
        ctx.arc(6 * s, -2 * s, 1.1 * s, 0, Math.PI * 2);
        ctx.fill();

        // tiny mushroom on the shoulder
        blockRect(5.6 * s, -10 * s, 2.2 * s, 4 * s, 1 * s, "#fdf3e3");
        ctx.fillStyle = "#ff7a8a";
        ctx.beginPath();
        ctx.ellipse(6.7 * s, -10 * s, 3 * s, 2 * s, 0, Math.PI, Math.PI * 2);
        ctx.fill();

        // twig + antenna with a glowing tip
        ctx.strokeStyle = "#8a7550";
        ctx.lineWidth = 1.1 * s;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, -23 * s);
        ctx.lineTo(-1.5 * s, -30 * s);
        ctx.lineTo(2 * s, -33 * s);
        ctx.moveTo(-1.5 * s, -30 * s);
        ctx.lineTo(-5 * s, -32 * s);
        ctx.stroke();
        ctx.fillStyle = "rgba(125, 255, 158, 0.95)";
        ctx.beginPath();
        ctx.arc(2 * s, -33 * s, 1.3 * s, 0, Math.PI * 2);
        ctx.fill();

        // CRT head (bezel + dark screen)
        blockRect(-8 * s, -23 * s, 16 * s, 16 * s, 4 * s, "#2c3a30");
        blockRect(-6 * s, -21 * s, 12 * s, 12 * s, 2.5 * s, "#0b1a12");

        // firefly-green pixel eyes that breathe, follow the pointer, and blink
        const pulse = 0.55 + 0.45 * Math.abs(Math.sin(f.phase * 2));
        const px = clamp((pointer.x - f.x) / 150, -1, 1) * 1.2 * s;
        const py = clamp((pointer.y - f.baseY) / 170, -1, 1) * 1 * s;
        ctx.save();
        ctx.shadowColor = `rgba(125, 255, 158, ${pulse})`;
        ctx.shadowBlur = 8 * s;
        ctx.fillStyle = `rgba(125, 255, 158, ${pulse})`;
        if (f.blink > 0) {
          ctx.fillRect(-4 * s + px, -15.6 * s + py, 3 * s, 0.9 * s);
          ctx.fillRect(1 * s + px, -15.6 * s + py, 3 * s, 0.9 * s);
        } else {
          ctx.fillRect(-3.8 * s + px, -16.8 * s + py, 2.4 * s, 2.4 * s);
          ctx.fillRect(1.4 * s + px, -16.8 * s + py, 2.4 * s, 2.4 * s);
        }
        ctx.restore();

        ctx.restore();
      }

      function drawFigures(dt) {
        beatPulse *= Math.pow(0.86, dt);
        for (const f of state.figures) {
          f.phase += f.bobSpeed * dt;
          f.x += f.vx * dt;
          if (f.x < -30) f.x = window.innerWidth + 30;
          if (f.x > window.innerWidth + 30) f.x = -30;
          if (f.appear < 1) f.appear = Math.min(1, f.appear + 0.05 * dt);
          f.blinkAt -= dt;
          if (f.blinkAt <= 0) {
            f.blink = 6;
            f.blinkAt = 120 + Math.random() * 260;
          }
          if (f.blink > 0) f.blink -= dt;
          const hop = (state.playing ? beatPulse : 0) * f.bounce;
          (f.type === "forest" ? drawForestSprite : drawFigure)(f, hop);
        }
        ctx.globalAlpha = 1;
      }

      function drawParticles(now) {
        const dt = Math.min(2.2, (now - lastFrameTime) / 16.67);
        lastFrameTime = now;
        const pull = Number(els.particlePull.value) / 100;
        const maxDistance = 210 * pull;
        const palette = palettes[state.paletteIndex];

        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.globalCompositeOperation = "lighter";

        for (let i = state.particles.length - 1; i >= 0; i -= 1) {
          const p = state.particles[i];
          const dx = pointer.x - p.x;
          const dy = pointer.y - p.y;
          const distance = Math.hypot(dx, dy) || 1;
          const influence = pointer.active ? clamp(1 - distance / maxDistance, 0, 1) : 0;

          if (influence > 0) {
            if (state.mode === "repel") {
              p.vx -= (dx / distance) * influence * 0.42 * pull;
              p.vy -= (dy / distance) * influence * 0.42 * pull;
            } else if (state.mode === "draw" || pointer.down) {
              p.vx += (dx / distance) * influence * 0.34 * pull;
              p.vy += (dy / distance) * influence * 0.34 * pull;
            } else {
              const tangentX = -dy / distance;
              const tangentY = dx / distance;
              p.vx += tangentX * influence * 0.24 * pull + (dx / distance) * influence * 0.05;
              p.vy += tangentY * influence * 0.24 * pull + (dy / distance) * influence * 0.05;
            }
          }

          p.phase += 0.025 * dt;
          p.vx += Math.cos(p.phase) * 0.008 * dt;
          p.vy += Math.sin(p.phase * 0.8) * 0.008 * dt;
          p.vx *= 0.988;
          p.vy *= 0.988;
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          if (p.x < -24) p.x = window.innerWidth + 24;
          if (p.x > window.innerWidth + 24) p.x = -24;
          if (p.y < -24) p.y = window.innerHeight + 24;
          if (p.y > window.innerHeight + 24) p.y = -24;

          if (p.life !== Infinity) {
            p.life -= dt;
            if (p.life <= 0) {
              state.particles.splice(i, 1);
              continue;
            }
          }

          const alpha = p.life !== Infinity ? clamp(p.life / 80, 0, 0.75) : 0.62;
          const radius = p.r + Math.sin(p.phase) * 0.7 + influence * 3.6;
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius * 5.2);
          gradient.addColorStop(0, hexToRgba(p.color, alpha));
          gradient.addColorStop(0.32, hexToRgba(p.glow, alpha * 0.36));
          gradient.addColorStop(1, hexToRgba(p.color, 0));

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius * 5.2, 0, Math.PI * 2);
          ctx.fill();

          if (influence > 0.34) {
            ctx.strokeStyle = hexToRgba(palette.accent, influence * 0.16);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(pointer.x, pointer.y);
            ctx.stroke();
          }
        }

        ctx.globalCompositeOperation = "source-over";

        // Ease the pointer-following aura toward the cursor and move it with a
        // compositor-only transform (frame-rate independent smoothing).
        const ease = 1 - Math.pow(0.86, dt);
        aura.x += (pointer.x - aura.x) * ease;
        aura.y += (pointer.y - aura.y) * ease;
        if (els.aura) els.aura.style.transform = `translate3d(${aura.x}px, ${aura.y}px, 0)`;

        drawFigures(dt);
        syncParticleCount();
        requestAnimationFrame(drawParticles);
      }

      function setupVisualizer() {
        for (let i = 0; i < 24; i += 1) {
          const bar = document.createElement("span");
          bar.className = "bar";
          bar.style.setProperty("--h", `${22 + Math.sin(i * 1.7) * 13 + (i % 7) * 7}%`);
          bar.style.setProperty("--d", `${560 + (i % 6) * 120}ms`);
          bar.style.setProperty("--delay", `${i * 34}ms`);
          els.visualizer.append(bar);
          state.bars.push(bar);
        }

        for (let i = 0; i < 16; i += 1) {
          const dot = document.createElement("span");
          dot.className = "sequence-dot";
          els.sequenceGrid.append(dot);
          state.sequenceDots.push(dot);
        }
      }

      // Lightweight stand-in for Suno-style prompt conditioning: the descriptive
      // words in the text prompt are read as a control signal that biases tempo,
      // energy, brightness and scale — analogous to how a real model encodes the
      // prompt into an embedding that steers generation.
      const promptLexicon = {
        tempo: [
          { words: ["轻快", "跳动", "速度", "律动", "明快", "快"], delta: 16 },
          { words: ["慢", "柔和", "空灵", "呼吸", "优雅", "舒缓"], delta: -16 },
        ],
        energy: [
          { words: ["坚定", "速度", "跳动", "律动", "明亮", "强"], delta: 14 },
          { words: ["柔和", "空灵", "呼吸", "轻", "慢"], delta: -14 },
        ],
        brightness: [
          { words: ["清亮", "明亮", "星", "清", "亮"], delta: 0.18 },
          { words: ["暖", "柔", "沉", "低"], delta: -0.16 },
        ],
      };

      function analyzePrompt(prompt) {
        const result = { tempo: 0, energy: 0, brightness: 1, scale: null };
        promptLexicon.tempo.forEach((g) => {
          if (g.words.some((w) => prompt.includes(w))) result.tempo += g.delta;
        });
        promptLexicon.energy.forEach((g) => {
          if (g.words.some((w) => prompt.includes(w))) result.energy += g.delta;
        });
        promptLexicon.brightness.forEach((g) => {
          if (g.words.some((w) => prompt.includes(w))) result.brightness += g.delta;
        });
        if (prompt.includes("空灵") || prompt.includes("星")) result.scale = "lydian";
        else if (prompt.includes("坚定")) result.scale = "dorian";
        else if (prompt.includes("明亮") || prompt.includes("清亮")) result.scale = "major";
        return result;
      }

      // Steer a range input halfway toward the prompt-implied target, so the prompt
      // visibly shapes the result while still respecting manual control.
      function nudgeRange(input, delta) {
        const value = Number(input.value);
        const target = clamp(value + delta, Number(input.min), Number(input.max));
        input.value = String(Math.round((value + target) / 2));
      }

      function composeMusic(forceNewSeed = true) {
        if (forceNewSeed) state.seed = Date.now() ^ hashString(els.musicPrompt.value);
        const prompt = els.musicPrompt.value.trim() || "flow";
        const palette = palettes[state.paletteIndex];
        const analysis = analyzePrompt(prompt);

        if (forceNewSeed) {
          if (analysis.tempo) nudgeRange(els.tempo, analysis.tempo);
          if (analysis.energy) nudgeRange(els.energy, analysis.energy);
        }

        const genre = genres[state.genre];
        const rng = mulberry32(hashString(`${prompt}-${state.seed}-${palette.name}-${state.genre}`));
        const scaleNames = Object.keys(scaleSteps);
        // The active genre supplies the scale pool; an explicit prompt mood word
        // still wins, and there is a small chance of a surprise scale.
        const scale = analysis.scale || choose(genre.scales, rng) || palette.scale;
        const pickedScale = rng() > 0.86 ? choose(scaleNames, rng) : scale;
        const key = rng() > 0.8 ? choose(Object.keys(keyMidi), rng) : palette.key;
        const root = keyMidi[key] + (rng() > 0.55 ? 0 : -12);
        const steps = scaleSteps[pickedScale];
        const chordRoots = [0, 3, 4, 2].map((base) => steps[base % steps.length]);
        const melody = Array.from({ length: 16 }, (_, index) => {
          // Sparser genres (ambient / healing) drop more notes, leaving space.
          if (rng() > genre.noteDensity && index % 4 !== 0) return null;
          return steps[Math.floor(rng() * steps.length)] + (rng() > 0.58 ? 12 : 0);
        });

        state.composition = {
          key,
          scale: pickedScale,
          root,
          steps,
          chordRoots,
          melody,
          brightness: clamp(analysis.brightness, 0.7, 1.3),
          wave: genre.leadWave,
          sparkle: rng() > 0.5,
        };
        updateStatus();
        animateVisualizerPattern();
        updateSequenceGrid();
      }

      function updateStatus() {
        const composition = state.composition;
        els.moodChip.textContent = `${genres[state.genre].zh} · ${palettes[state.paletteIndex].name} / ${composition.key} ${composition.scale}`;
        els.tempoChip.textContent = `${els.tempo.value} BPM`;
        els.energyChip.textContent = `Energy ${els.energy.value}%`;
      }

      function animateVisualizerPattern() {
        const rng = mulberry32(state.seed + hashString(els.musicPrompt.value));
        state.bars.forEach((bar, index) => {
          const height = 16 + rng() * 70 + Math.sin(index * 0.6) * 12;
          bar.style.setProperty("--h", `${clamp(height, 10, 96)}%`);
          bar.style.setProperty("--d", `${520 + rng() * 780}ms`);
        });
      }

      function updateSequenceGrid(activeIndex = -1) {
        if (!state.composition) return;
        const genre = genres[state.genre];
        state.sequenceDots.forEach((dot, index) => {
          const hasMelody = state.composition.melody[index] !== null;
          const hasBeat = (genre.kick && genre.kick[index]) || (genre.hat && genre.hat[index]);
          dot.classList.toggle("on", hasMelody || hasBeat || index % 4 === 0);
          dot.classList.toggle("active", index === activeIndex);
          dot.style.opacity = hasMelody ? "1" : hasBeat ? "0.74" : "0.38";
        });
      }

      function ensureAudio() {
        if (audio) return audio;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const context = new AudioContext();
        const master = context.createGain();
        const delay = context.createDelay(0.5);
        const delayGain = context.createGain();
        const filter = context.createBiquadFilter();

        master.gain.value = 0.7;
        filter.type = "lowpass";
        filter.frequency.value = 5200;
        filter.Q.value = 0.55;
        delay.delayTime.value = 0.18;
        delayGain.gain.value = 0.16;

        master.connect(filter);
        filter.connect(context.destination);
        filter.connect(delay);
        delay.connect(delayGain);
        delayGain.connect(filter);

        // Dedicated bus for ambient soundscapes, straight to output (bypasses
        // the music filter/delay so noise stays clean).
        const ambientBus = context.createGain();
        ambientBus.gain.value = 0.9;
        ambientBus.connect(context.destination);

        audio = { context, master, filter, ambientBus };
        return audio;
      }

      // —— 声景 / ambient soundscapes ——
      function noiseBuffer(seconds) {
        const { context } = ensureAudio();
        const len = Math.floor(context.sampleRate * seconds);
        const buffer = context.createBuffer(1, len, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < len; i += 1) data[i] = Math.random() * 2 - 1;
        return buffer;
      }

      function startNoiseLayer(kind) {
        const { context, ambientBus } = ensureAudio();
        const src = context.createBufferSource();
        src.buffer = noiseBuffer(2);
        src.loop = true;
        const gain = context.createGain();
        const extra = [];
        if (kind === "white") {
          const lp = context.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 9200;
          gain.gain.value = 0.05;
          src.connect(lp);
          lp.connect(gain);
          extra.push(lp);
        } else {
          const hp = context.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 430;
          const lp = context.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 7200;
          gain.gain.value = 0.09;
          src.connect(hp);
          hp.connect(lp);
          lp.connect(gain);
          // gentle shimmer so the rain breathes
          const lfo = context.createOscillator();
          lfo.frequency.value = 0.5;
          const lfoGain = context.createGain();
          lfoGain.gain.value = 0.03;
          lfo.connect(lfoGain);
          lfoGain.connect(gain.gain);
          lfo.start();
          extra.push(hp, lp, lfo, lfoGain);
        }
        gain.connect(ambientBus);
        src.start();
        return { src, gain, extra };
      }

      function stopNoiseLayer(layer) {
        if (!layer) return;
        try {
          layer.src.stop();
        } catch (e) {
          /* already stopped */
        }
        layer.src.disconnect();
        layer.gain.disconnect();
        layer.extra.forEach((node) => {
          if (node.stop) {
            try {
              node.stop();
            } catch (e) {
              /* noop */
            }
          }
          node.disconnect();
        });
      }

      function chimeHit(time, midi) {
        const { context, ambientBus } = ensureAudio();
        const osc = context.createOscillator();
        const osc2 = context.createOscillator();
        const gain = context.createGain();
        osc.type = "sine";
        osc2.type = "sine";
        osc.frequency.value = midiToFreq(midi);
        osc2.frequency.value = midiToFreq(midi + 12) * 1.001;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(0.16, time + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 2.4);
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(ambientBus);
        osc.start(time);
        osc2.start(time);
        osc.stop(time + 2.6);
        osc2.stop(time + 2.6);
      }

      function chimeLoop() {
        if (!ambient.chimeOn) return;
        const { context } = ensureAudio();
        const pentatonic = [72, 74, 76, 79, 81, 84, 86, 88];
        const hits = Math.random() < 0.3 ? 2 : 1;
        for (let i = 0; i < hits; i += 1) {
          chimeHit(context.currentTime + i * 0.13, pentatonic[Math.floor(Math.random() * pentatonic.length)]);
        }
        ambient.chimeTimer = window.setTimeout(chimeLoop, 600 + Math.random() * 2000);
      }

      function keyClick(time) {
        const { context, ambientBus } = ensureAudio();
        const src = context.createBufferSource();
        src.buffer = noiseBuffer(0.03);
        const bp = context.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 2200 + Math.random() * 1300;
        bp.Q.value = 0.9;
        const gain = context.createGain();
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(0.12, time + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
        src.connect(bp);
        bp.connect(gain);
        gain.connect(ambientBus);
        src.start(time);
        // little key "thock"
        const osc = context.createOscillator();
        const g2 = context.createGain();
        osc.type = "triangle";
        osc.frequency.value = 170 + Math.random() * 90;
        g2.gain.setValueAtTime(0.0001, time);
        g2.gain.exponentialRampToValueAtTime(0.05, time + 0.002);
        g2.gain.exponentialRampToValueAtTime(0.0001, time + 0.045);
        osc.connect(g2);
        g2.connect(ambientBus);
        osc.start(time);
        osc.stop(time + 0.06);
      }

      function typeLoop() {
        if (!ambient.typeOn) return;
        const { context } = ensureAudio();
        keyClick(context.currentTime);
        // bursts of quick keys with occasional pauses, like real typing
        const gap = Math.random() < 0.18 ? 420 + Math.random() * 900 : 90 + Math.random() * 150;
        ambient.typeTimer = window.setTimeout(typeLoop, gap);
      }

      function toggleAmbient(id, chip) {
        const { context } = ensureAudio();
        if (context.state === "suspended") context.resume();
        let on = false;
        if (id === "white") {
          if (ambient.white) {
            stopNoiseLayer(ambient.white);
            ambient.white = null;
          } else {
            ambient.white = startNoiseLayer("white");
            on = true;
          }
        } else if (id === "rain") {
          if (ambient.rain) {
            stopNoiseLayer(ambient.rain);
            ambient.rain = null;
          } else {
            ambient.rain = startNoiseLayer("rain");
            on = true;
          }
        } else if (id === "chime") {
          ambient.chimeOn = !ambient.chimeOn;
          on = ambient.chimeOn;
          if (on) chimeLoop();
          else window.clearTimeout(ambient.chimeTimer);
        } else if (id === "type") {
          ambient.typeOn = !ambient.typeOn;
          on = ambient.typeOn;
          if (on) typeLoop();
          else window.clearTimeout(ambient.typeTimer);
        }
        chip.classList.toggle("active", on);
        chip.setAttribute("aria-pressed", on ? "true" : "false");
      }

      function setupSoundscapes() {
        soundscapes.forEach((s) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "genre-chip";
          button.dataset.sound = s.id;
          button.setAttribute("aria-pressed", "false");
          button.innerHTML = `${s.zh} <small>${s.en}</small>`;
          button.addEventListener("click", () => toggleAmbient(s.id, button));
          els.soundRow.append(button);
        });
      }

      function envelope(gain, time, peak, attack, decay, sustain, release) {
        gain.gain.cancelScheduledValues(time);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), time + attack);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, sustain), time + attack + decay);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + attack + decay + release);
      }

      function playTone(midi, time, duration, options = {}) {
        const { context, master } = ensureAudio();
        const osc = context.createOscillator();
        const gain = context.createGain();
        const filter = context.createBiquadFilter();
        const energy = Number(els.energy.value) / 100;

        osc.type = options.wave || state.composition.wave;
        osc.frequency.setValueAtTime(midiToFreq(midi), time);
        if (options.detune) osc.detune.setValueAtTime(options.detune, time);

        const brightness = state.composition ? state.composition.brightness : 1;
        filter.type = "lowpass";
        filter.frequency.setValueAtTime((options.cutoff || 1400 + energy * 4200) * brightness, time);
        filter.Q.value = options.q || 1.2;

        envelope(gain, time, options.peak || 0.08, options.attack || 0.012, options.decay || 0.08, options.sustain || 0.028, options.release || duration);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        osc.start(time);
        osc.stop(time + duration + 0.8);
      }

      function playPad(rootMidi, time, duration, wave, shape) {
        const chord = shape || [0, 4, 7];
        chord.forEach((offset, index) => {
          playTone(rootMidi + offset, time + index * 0.012, duration, {
            wave: wave || "sine",
            peak: 0.03,
            attack: 0.28,
            decay: 0.32,
            sustain: 0.018,
            release: duration + 0.42,
            cutoff: 1200,
            detune: index * 4 - 4,
          });
        });
      }

      function playSnare(time) {
        const { context, master } = ensureAudio();
        const bufferSize = context.sampleRate * 0.12;
        const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i += 1) data[i] = Math.random() * 2 - 1;
        const source = context.createBufferSource();
        const bp = context.createBiquadFilter();
        const gain = context.createGain();
        source.buffer = buffer;
        bp.type = "bandpass";
        bp.frequency.value = 1850;
        bp.Q.value = 0.8;
        envelope(gain, time, 0.11, 0.002, 0.06, 0.02, 0.12);
        source.connect(bp);
        bp.connect(gain);
        gain.connect(master);
        source.start(time);

        const osc = context.createOscillator();
        const g2 = context.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(190, time);
        envelope(g2, time, 0.07, 0.002, 0.05, 0.01, 0.08);
        osc.connect(g2);
        g2.connect(master);
        osc.start(time);
        osc.stop(time + 0.2);
      }

      // Flag a visual beat pulse at the audio-scheduled kick time so the block
      // people bounce in sync.
      function scheduleBeat(time) {
        const { context } = ensureAudio();
        window.setTimeout(() => {
          if (state.playing) beatPulse = 1;
        }, Math.max(0, (time - context.currentTime) * 1000));
      }

      function playKick(time) {
        const { context, master } = ensureAudio();
        const osc = context.createOscillator();
        const gain = context.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(120, time);
        osc.frequency.exponentialRampToValueAtTime(38, time + 0.18);
        envelope(gain, time, 0.3, 0.006, 0.04, 0.12, 0.14);
        osc.connect(gain);
        gain.connect(master);
        osc.start(time);
        osc.stop(time + 0.28);
      }

      function playHat(time) {
        const { context, master } = ensureAudio();
        const bufferSize = context.sampleRate * 0.06;
        const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i += 1) data[i] = Math.random() * 2 - 1;

        const source = context.createBufferSource();
        const gain = context.createGain();
        const filter = context.createBiquadFilter();
        source.buffer = buffer;
        filter.type = "highpass";
        filter.frequency.value = 6500;
        envelope(gain, time, 0.045, 0.003, 0.012, 0.018, 0.035);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        source.start(time);
      }

      function scheduleStep(time, index) {
        if (index > 0 && index % 32 === 0 && els.autoMusic.checked) {
          composeMusic(true);
          burst(14);
        }

        const composition = state.composition;
        const genre = genres[state.genre];
        const stepDuration = 60 / Number(els.tempo.value) / 2;
        const energy = Number(els.energy.value) / 100;
        const i16 = index % 16;
        const swingT = i16 % 2 === 1 ? time + stepDuration * (genre.swing || 0) : time;
        const chordRoot = composition.root + composition.chordRoots[Math.floor(i16 / 4)];
        const melodyStep = composition.melody[index % composition.melody.length];

        // Chords / pad
        if (genre.padEvery && index % genre.padEvery === 0) {
          playPad(chordRoot - 12, time, stepDuration * (genre.padLong || 7.6), genre.chordWave, genre.chordShape);
        }

        // Drums (driven by the genre patterns)
        if (genre.kick[i16]) {
          playKick(time);
          scheduleBeat(time);
        }
        if (genre.snare && genre.snare[i16]) playSnare(time);
        if (genre.hat && genre.hat[i16] && energy > 0.3) playHat(swingT + stepDuration * 0.02);

        // Bass
        if (genre.bassEvery && index % genre.bassEvery === 0) {
          playTone(chordRoot - 24, time, stepDuration * (genre.bassLong || 0.8), {
            wave: genre.bassWave,
            peak: 0.05 + energy * 0.06,
            attack: 0.01,
            decay: 0.06,
            sustain: 0.022,
            release: 0.18,
            cutoff: 600 + energy * 1400,
          });
        }

        // Lead melody
        if (melodyStep !== null && (energy > 0.42 || i16 % 2 === 0)) {
          playTone(composition.root + melodyStep + 12, swingT + stepDuration * 0.02, stepDuration * 0.72, {
            wave: genre.leadWave,
            peak: 0.044 + energy * 0.05,
            attack: 0.01,
            decay: 0.05,
            sustain: 0.02,
            release: 0.2,
            cutoff: 1500 + energy * 4200,
          });
        }

        window.setTimeout(() => {
          if (state.playing) updateSequenceGrid(i16);
        }, Math.max(0, (time - ensureAudio().context.currentTime) * 1000));
      }

      function schedulerTick() {
        const { context } = ensureAudio();
        const lookAhead = 0.16;
        while (nextStepTime < context.currentTime + lookAhead) {
          scheduleStep(nextStepTime, absoluteStep);
          nextStepTime += 60 / Number(els.tempo.value) / 2;
          stepIndex = (stepIndex + 1) % 16;
          absoluteStep += 1;
        }
      }

      async function startMusic() {
        const { context } = ensureAudio();
        if (context.state === "suspended") await context.resume();
        state.playing = true;
        document.body.classList.add("playing");
        els.playIcon.textContent = "Ⅱ";
        els.playLabel.textContent = "暂停";
        els.playToggle.setAttribute("aria-pressed", "true");
        nextStepTime = context.currentTime + 0.04;
        stepIndex = 0;
        absoluteStep = 0;
        schedulerId = window.setInterval(schedulerTick, 48);
        burst(22);
      }

      function stopMusic() {
        state.playing = false;
        document.body.classList.remove("playing");
        els.playIcon.textContent = "▶";
        els.playLabel.textContent = "播放";
        els.playToggle.setAttribute("aria-pressed", "false");
        if (schedulerId) window.clearInterval(schedulerId);
        schedulerId = null;
        updateSequenceGrid();
      }

      function bindEvents() {
        window.addEventListener("resize", resizeCanvas);

        window.addEventListener("pointermove", (event) => {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.active = true;
        });

        window.addEventListener("pointerdown", (event) => {
          pointer.down = true;
          pointer.active = true;
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          burst(28);
        });

        window.addEventListener("pointerup", () => {
          pointer.down = false;
        });

        window.addEventListener("pointercancel", () => {
          pointer.down = false;
          pointer.active = false;
        });

        window.addEventListener("pointerleave", () => {
          pointer.active = false;
          pointer.down = false;
        });

        els.flowSpeed.addEventListener("input", updateBackgroundControls);
        els.colorPower.addEventListener("input", updateBackgroundControls);
        els.particleDensity.addEventListener("input", syncParticleCount);
        els.particlePull.addEventListener("change", () => burst(10));
        els.burstParticles.addEventListener("click", () => burst(52));
        els.summonFigures.addEventListener("click", () => {
          for (let i = 0; i < 3; i += 1) spawnFigure();
          burst(12);
        });
        els.summonForest.addEventListener("click", () => {
          for (let i = 0; i < 3; i += 1) spawnFigure(undefined, undefined, "forest");
          burst(12);
        });
        window.addEventListener("dblclick", (event) => {
          spawnFigure(event.clientX, event.clientY);
        });

        els.tempo.addEventListener("input", updateStatus);
        els.energy.addEventListener("input", () => {
          updateStatus();
          animateVisualizerPattern();
          if (audio) audio.filter.frequency.setTargetAtTime(2400 + Number(els.energy.value) * 56, audio.context.currentTime, 0.08);
        });

        els.randomPrompt.addEventListener("click", () => {
          const current = els.musicPrompt.value;
          const choices = promptIdeas.filter((idea) => idea !== current);
          els.musicPrompt.value = choose(choices, Math.random);
          composeMusic(true);
          burst(18);
        });

        els.musicPrompt.addEventListener("change", () => composeMusic(true));

        els.generateMusic.addEventListener("click", () => {
          composeMusic(true);
          burst(26);
        });

        els.playToggle.addEventListener("click", () => {
          if (state.playing) stopMusic();
          else startMusic();
        });

        document.querySelectorAll(".mode-button").forEach((button) => {
          button.addEventListener("click", () => {
            setParticleMode(button.dataset.mode);
            burst(18);
          });
        });

        document.querySelectorAll(".scene-card").forEach((button) => {
          button.addEventListener("click", () => {
            applyScene(button.dataset.scene);
          });
        });
      }

      function applyScene(sceneId) {
        const scene = scenePresets[sceneId];
        if (!scene) return;

        els.musicPrompt.value = scene.prompt;
        els.particleDensity.value = scene.density;
        els.particlePull.value = scene.pull;
        setParticleMode(scene.mode);
        setGenre(scene.genre || state.genre, { recompose: false });
        setPalette(scene.palette);
        updateBackgroundControls();
        syncParticleCount();
        composeMusic(true);
        burst(38);

        document.querySelectorAll(".scene-card").forEach((button) => {
          const isActive = button.dataset.scene === sceneId;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      function init() {
        setupPalettes();
        setupGenres();
        setupSoundscapes();
        setupVisualizer();
        bindEvents();
        resizeCanvas();
        updateBackgroundControls();
        applyScene("night");
        for (let i = 0; i < 5; i += 1) spawnFigure();
        for (let i = 0; i < 2; i += 1) spawnFigure(undefined, undefined, "forest");
        requestAnimationFrame(drawParticles);
      }

      init();
    </script>
  </body>
</html>
