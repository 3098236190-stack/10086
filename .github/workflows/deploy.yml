name: Deploy universe to GitHub Pages

on:
  push:
    branches: [claude/awesome-carson-6ExS7]
    paths:
      - "universe/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - run: npm ci
      - run: npm run build
      # Publish the static export to the gh-pages branch (adds .nojekyll for _next).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./universe/out
          publish_branch: gh-pages
          force_orphan: true
