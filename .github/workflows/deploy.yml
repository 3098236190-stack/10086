name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/awesome-carson-6ExS7]
    paths:
      - "universe/**"
      - "index.html"
      - "about.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: universe/package-lock.json
      - name: Build the 3D universe (Next.js static export)
        working-directory: universe
        run: |
          npm ci
          npm run build
      - name: Assemble unified site ( / = base, /universe = 3D )
        run: |
          rm -rf site
          mkdir -p site
          cp index.html about.html site/ 2>/dev/null || true
          mkdir -p site/universe
          cp -r universe/out/* site/universe/
          touch site/.nojekyll
          ls -la site && echo "--- universe ---" && ls site/universe | head
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
